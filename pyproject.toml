[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphablokus"
version = "0.1.0"
description = "AlphaZero-style self-play reinforcement learning for Blokus Duo"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "dataclass-wizard>=0.22.0",
    "loguru>=0.7.0",
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.60.0",
    "plotly>=5.0.0",
    "psutil>=5.9.0",
    "wandb>=0.27.0",
    "numba>=0.65.1",
]

[project.scripts]
alphablokus = "alphablokus.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.14",
]
# JAX spike (docs/plans/archive/jax-spike.md). CPU wheel by default; on the CUDA box
# install the accelerated variant instead: uv sync --extra jax-cuda
jax = [
    "jax>=0.6.0",
    "mctx>=0.0.5",
    "matplotlib>=3.8.0",
]
jax-cuda = [
    "jax[cuda12]>=0.6.0",
    "mctx>=0.0.5",
    "matplotlib>=3.8.0",
]
# S3-compatible object-storage sync for cloud runs (storage/object_store.py).
s3 = [
    "boto3>=1.34.0",
]
# Web-play asset export (scripts/export_web_assets.py): ONNX export + optional
# quantisation for the in-browser engine.
web = [
    "onnx>=1.16.0",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.20.0",
    "onnxconverter-common>=1.14.0",
]
# Local full-strength play server (alphablokus/play/, `alphablokus-play`).
play = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphablokus"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]

[tool.mypy]
python_version = "3.11"
files = ["src/alphablokus"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "mctx.*",
    "numba.*",
    "wandb.*",
    "plotly.*",
    "dataclass_wizard.*",
    "pandas.*",
    "pyarrow.*",
    "tqdm.*",
    "psutil.*",
    "matplotlib.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "wandb-workspaces>=0.3.9",
]
