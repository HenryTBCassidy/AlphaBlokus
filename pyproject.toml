[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphablokus"
version = "0.1.0"
description = "AlphaZero-style self-play reinforcement learning for Blokus Duo"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "dataclass-wizard>=0.22.0",
    "loguru>=0.7.0",
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.60.0",
    "plotly>=5.0.0",
    "psutil>=5.9.0",
    "wandb>=0.27.0",
    "numba>=0.65.1",
]

[project.scripts]
alphablokus = "alphablokus.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.14",
]
# JAX spike (docs/plans/jax-spike.md). CPU wheel by default; on the CUDA box
# install the accelerated variant instead: uv sync --extra jax-cuda
jax = [
    "jax>=0.6.0",
    "mctx>=0.0.5",
    "matplotlib>=3.8.0",
]
jax-cuda = [
    "jax[cuda12]>=0.6.0",
    "mctx>=0.0.5",
    "matplotlib>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphablokus"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]

[tool.mypy]
# Lenient baseline (refactor plan R5). Strictness ratchets to
# disallow_untyped_defs in R28 once the typing sweep (R27) lands.
python_version = "3.11"
files = ["src/alphablokus"]
no_implicit_optional = true
warn_redundant_casts = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "mctx.*",
    "numba.*",
    "wandb.*",
    "plotly.*",
    "dataclass_wizard.*",
    "pandas.*",
    "pyarrow.*",
    "tqdm.*",
    "psutil.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# Enumerated typing debt (66 errors as of the R5 baseline), burned down by
# refactor plan rows R27 (annotation sweep), R28 (strict ratchet + the
# Protocol-narrowing decision), R31 (INeuralNetWrapper drift). Modules NOT
# listed here are fully checked — do not add to this list.
[[tool.mypy.overrides]]
module = [
    "alphablokus.core.coach",
    "alphablokus.core.inference_channel",
    "alphablokus.core.jaxplay.backend",
    "alphablokus.search.mcts",
    "alphablokus.core.parallel_self_play",
    "alphablokus.core.self_play",
    "alphablokus.storage.metrics",
    "alphablokus.storage.selfplay_store",
    "alphablokus.games.base_wrapper",
    "alphablokus.games.blokusduo.board",
    "alphablokus.games.blokusduo.game",
    "alphablokus.games.blokusduo.jaxenv.bridge",
    "alphablokus.games.blokusduo.movegen_runtime",
    "alphablokus.games.blokusduo.movegen_tables",
    "alphablokus.games.blokusduo.neuralnets.net",
    "alphablokus.games.blokusduo.pentobi_player",
    "alphablokus.games.blokusduo.pentobi_translation",
    "alphablokus.games.tictactoe.game",
    "alphablokus.games.tictactoe.minimax",
    "alphablokus.reporting.display",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "wandb-workspaces>=0.3.9",
]
